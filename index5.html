<!DOCTYPE html>
<html>
    <head>
        <title>My Calculator</title>
        <link rel="stylesheet" href="style5.css">
    </head>
    <body>
        <div id="parent">
             <input type="text" value="2 + 3" placeholder="|" readonly> 
             <div id="child1">
                <div> <button class="operator"> AC</button></div>
                <div> <button class="operator"> % </button></div>
                <div> <button class="operator"> DEL </button></div>
                <div> <button class="operator"> / </button></div>
             </div>
             <div id="child2">
                <div> <button > 7</button></div>
                <div> <button> 8 </button></div>
                <div> <button> 9 </button></div>
                <div> <button class="operator"> * </button></div>
             </div>
             <div id="child3">
                <div> <button> 4</button></div>
                <div> <button> 5 </button></div>
                <div> <button> 6 </button></div>
                <div> <button class="operator"> - </button></div>
             </div>
             <div id="child4">
                <div> <button> 1</button></div>
                <div> <button> 2</button></div>
                <div> <button> 3 </button></div>
                <div> <button class="operator"> + </button></div>
             </div>
             <div id="child5">
                <div> <button> 00</button></div>
                <div> <button> 0 </button></div>
                <div> <button> . </button></div>
                <div> <button class="operator"> = </button></div>
                
             </div>
        </div>
    </body>
</html>
